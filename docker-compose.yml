version: "3.9"

services:
  mysql:
    image: mysql:8.4
    container_name: saas-dashboard-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: saas_dashboard
      MYSQL_USER: saas_user
      MYSQL_PASSWORD: saas_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saas-dashboard-backend
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env.example
    environment:
      NODE_ENV: development
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: saas_user
      DB_PASSWORD: saas_password
      DB_NAME: saas_dashboard
      CORS_ORIGIN: http://localhost:5173
      COOKIE_SECURE: "false"
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: saas-dashboard-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql_data:
